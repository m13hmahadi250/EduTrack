<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background matching the exact beige/grey tone of the user's photo -->
  <rect width="100%" height="100%" fill="#EAE6DF" />
  
  <g transform="translate(0, 15)">
    <!-- EDUTRACK Text in bold blue -->
    <text x="50%" y="220" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
          font-size="92" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#0D5BFF">EDUTRACK</text>
    
    <!-- ADMIN Text in bold black, overlapping the EDUTRACK text -->
    <text x="50%" y="315" 
          text-anchor="middle" 
          font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
          font-size="124" 
          font-weight="900" 
          letter-spacing="-2.5" 
          fill="#000000">ADMIN</text>
  </g>
</svg>
